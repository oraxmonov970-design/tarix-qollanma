<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Tarix Qo'llanma va Testlar2</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: #F0E6CF;
    color: #2B2118;
    font-family: -apple-system, Roboto, "Segoe UI", Arial, sans-serif;
  }
  .serif { font-family: Georgia, "Times New Roman", serif; }
  .screen { display: none; }
  .screen.active { display: block; }

  header {
    padding: 24px 20px 18px;
    text-align: center;
    border-bottom: 3px double #C9A227;
  }
  header .eyebrow {
    letter-spacing: 0.25em;
    font-size: 11px;
    color: #A4462B;
    font-weight: 600;
    margin: 0 0 4px;
  }
  header h1 {
    font-size: 1.5rem;
    font-weight: 700;
    color: #1B2A4A;
    line-height: 1.15;
    margin: 0;
  }

  .topbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 16px 8px;
    max-width: 720px;
    margin: 0 auto;
  }
  .back-btn {
    background: none;
    border: none;
    font-size: 20px;
    color: #1B2A4A;
    padding: 4px 8px;
  }
  .topbar h2 {
    font-size: 1.1rem;
    color: #1B2A4A;
    margin: 0;
  }

  main { padding: 12px 16px 60px; max-width: 720px; margin: 0 auto; }

  .btn {
    display: inline-block;
    padding: 12px 18px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    border: none;
    text-align: center;
  }
  .btn-primary { background: #1B2A4A; color: #F0E6CF; }
  .btn-gold { background: #C9A227; color: #1B2A4A; }
  .btn-outline { background: transparent; color: #1B2A4A; border: 1.5px solid #1B2A4A; }
  .btn-danger { background: transparent; color: #A4462B; border: 1.5px solid #A4462B; }
  .btn-block { display: block; width: 100%; margin-top: 10px; }
  .btn:active { transform: scale(0.98); }

  .big-test-card {
    background: linear-gradient(135deg, #1B2A4A, #2F5D62);
    color: #F0E6CF;
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 16px;
    border: 2px solid #C9A227;
  }
  .big-test-card h3 { margin: 0 0 4px; font-size: 1.2rem; }
  .big-test-card p { margin: 0 0 12px; font-size: 13px; opacity: 0.85; }

  .topic-card {
    background: #FAF5E8;
    border: 1px solid #DDD0AE;
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .topic-card .info { min-width: 0; }
  .topic-card .title { font-weight: 600; font-size: 14.5px; color: #1B2A4A; }
  .topic-card .tag { font-size: 11px; color: #A4462B; margin-top: 3px; }
  .topic-card .count { font-size: 11px; color: #5A5140; margin-top: 2px; }
  .chev { color: #C9A227; font-size: 20px; }

  .empty-box {
    text-align: center;
    padding: 40px 20px;
    color: #5A5140;
    font-size: 13.5px;
  }

  .guide-text {
    background: #FAF5E8;
    border: 1px solid #DDD0AE;
    border-radius: 14px;
    padding: 16px;
    font-size: 14.5px;
    line-height: 1.7;
    white-space: pre-wrap;
    margin-bottom: 16px;
  }

  label.field-label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: #5A5140;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 14px 0 6px;
  }
  input[type=text], textarea, select {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1.5px solid #C9A227;
    background: #FAF5E8;
    color: #2B2118;
    font-size: 14px;
    font-family: inherit;
    outline: none;
  }
  textarea { min-height: 110px; resize: vertical; }

  .q-block {
    background: #FAF5E8;
    border: 1px solid #DDD0AE;
    border-radius: 12px;
    padding: 12px;
    margin-top: 12px;
  }
  .q-block .q-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .q-head span { font-size: 12px; font-weight: 700; color: #A4462B; }
  .opt-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .opt-row input[type=text] { flex: 1; }
  .opt-row input[type=radio] { width: 18px; height: 18px; accent-color: #1B2A4A; }

  .remove-link {
    background: none; border: none; color: #A4462B; font-size: 12px; font-weight: 600;
  }

  .quiz-progress { font-size: 12px; color: #5A5140; margin-bottom: 10px; }
  .quiz-q { font-size: 16px; font-weight: 600; color: #1B2A4A; margin-bottom: 16px; line-height: 1.4; }
  .opt-btn {
    display: block;
    width: 100%;
    text-align: left;
    padding: 13px 14px;
    border-radius: 12px;
    border: 1.5px solid #C9A227;
    background: #FAF5E8;
    color: #2B2118;
    font-size: 14px;
    margin-bottom: 10px;
  }
  .opt-btn.correct { background: #2F5D62; border-color: #2F5D62; color: #F0E6CF; }
  .opt-btn.wrong { background: #A4462B; border-color: #A4462B; color: #F0E6CF; }
  .opt-btn.disabled { pointer-events: none; }

  .score-box {
    text-align: center;
    padding: 24px 16px;
    background: #FAF5E8;
    border: 2px solid #C9A227;
    border-radius: 16px;
    margin-bottom: 16px;
  }
  .score-box .num { font-size: 2.4rem; font-weight: 700; color: #1B2A4A; font-family: Georgia, serif; }
  .score-box .lbl { font-size: 13px; color: #5A5140; margin-top: 4px; }

  .review-item {
    background: #FAF5E8;
    border: 1px solid #DDD0AE;
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 10px;
  }
  .review-item .q { font-size: 13.5px; font-weight: 600; color: #1B2A4A; margin-bottom: 6px; }
  .review-item .your { font-size: 12.5px; color: #A4462B; }
  .review-item .right { font-size: 12.5px; color: #2F5D62; margin-top: 2px; }

  .region-tag {
    font-size: 10.5px;
    padding: 2px 8px;
    border-radius: 999px;
    border: 1px solid;
    display: inline-block;
  }
  .region-tag.markaziy { color: #2F5D62; border-color: #2F5D62; }
  .region-tag.jahon { color: #A4462B; border-color: #A4462B; }
</style>
</head>
<body>

<header>
  <p class="eyebrow">O'QITUVCHI UCHUN QO'LLANMA</p><button class="btn btn-primary btn-block" style="margin-top:10px;" onclick="openSelectScreen()">Mavzu tanlab test</button>
  <h1 class="serif">Tarix Qo'llanma va Testlar2</h1>
</header>

<!-- HOME -->
<div class="screen active" id="screen-home">
  <main>
    <div class="big-test-card" id="bigTestCard">
      <h3 class="serif">Katta test</h3>
      <p id="bigTestDesc">Barcha mavzulardan yig'ilgan savollar</p>
      <button class="btn btn-gold btn-block" onclick="startBigTest()">Katta testni boshlash</button>
    <button class="btn btn-primary btn-block" style="margin-top:10px;" onclick="openSelectScreen()">Mavzu tanlab test</button></div>

    <button class="btn btn-primary btn-block" onclick="openForm()">+ Yangi mavzu qo'shish</button>

    <div id="topicList" style="margin-top:16px;"></div>
  </main>
</div>

<!-- TOPIC FORM -->
<div class="screen" id="screen-form">
  <div class="topbar">
    <button class="back-btn" onclick="goHome()">←</button>
    <h2 id="formHeading">Yangi mavzu</h2>
  </div>
  <main>
    <label class="field-label">Mavzu nomi</label>
    <input type="text" id="f-title" placeholder="Masalan: Amir Temur va Temuriylar davri" />

    <label class="field-label">Yo'nalish</label>
    <select id="f-region">
      <option value="markaziy">Markaziy Osiyo / O'zbekiston</option>
      <option value="jahon">Jahon tarixi</option>
    </select>

    <label class="field-label">Qo'llanma matni</label>
    <textarea id="f-guide" placeholder="Mavzu bo'yicha tushuntirish matnini shu yerga yozing..."></textarea>

    <label class="field-label">Test savollari</label>
    <div id="qBuilder"></div>
    <button class="btn btn-outline btn-block" onclick="addQuestionBlock()">+ Savol qo'shish</button>

    <div style="display:flex; gap:10px; margin-top:20px;">
      <button class="btn btn-outline" style="flex:1;" onclick="goHome()">Bekor qilish</button>
      <button class="btn btn-primary" style="flex:1;" onclick="saveTopic()">Saqlash</button>
     </div>
  </main>
</div>

<!-- SELECT TOPICS FOR TEST -->
<div class="screen" id="screen-select">
  <header>
    <button class="btn-back" onclick="goHome()">‹ Orqaga</button>
    <h1 class="serif">Mavzu tanlab test</h1>
  </header>
  <main>
    <p style="margin-bottom:10px;">Kamida 1 ta, ko'pi bilan 5 ta mavzu tanlang</p>
    <div id="selectList"></div>
    <button class="btn btn-gold btn-block" id="startSelectedBtn" style="margin-top:16px;" onclick="startSelectedTest()" disabled>Tanlangan mavzulardan test</button>
  </main>
</div><!-- TOPIC VIEW -->
<div class="screen" id="screen-topic">
  <div class="topbar">
    <button class="back-btn" onclick="goHome()">←</button>
    <h2 id="topicViewTitle"></h2>
  </div>
  <main>
    <div id="topicViewTag" style="margin-bottom:10px;"></div>
    <div class="guide-text" id="topicViewGuide"></div>
    <button class="btn btn-gold btn-block" id="topicStartTestBtn" onclick="startTopicTest()">Testni boshlash</button>
    <div style="display:flex; gap:10px; margin-top:10px;">
      <button class="btn btn-outline" style="flex:1;" onclick="editTopic()">Tahrirlash</button>
      <button class="btn btn-danger" style="flex:1;" onclick="deleteTopic()">O'chirish</button>
    </div>
  </main>
</div>

<!-- QUIZ -->
<div class="screen" id="screen-quiz">
  <div class="topbar">
    <button class="back-btn" onclick="goHome()">←</button>
    <h2 id="quizHeading">Test</h2>
  </div>
  <main>
    <div class="quiz-progress" id="quizProgress"></div>
    <div class="quiz-q" id="quizQ"></div>
    <div id="quizOpts"></div>
    <button class="btn btn-gold btn-block" id="nextBtn" style="display:none;" onclick="goNext()">Keyingisi</button>
  </main>
</div>

<!-- RESULT -->
<div class="screen" id="screen-result">
  <div class="topbar">
    <h2>Natija</h2>
  </div>
  <main>
    <div class="score-box">
      <div class="num" id="resultScore"></div>
      <div class="lbl">to'g'ri javob</div>
    </div>
    <div id="resultReview"></div>
    <button class="btn btn-primary btn-block" onclick="goHome()">Bosh sahifaga qaytish</button>
  </main>
</div>

<script>
const STORAGE_KEY = "tarix_qollanma_topics_v1";

const BUILTIN_TOPICS = [
  {
    id: "builtin_1",
    title: "Qadimgi tarix ildizlari (6-sinf, 1-mavzu)",
    region: "jahon",
    guide: `1. Kirish: Vatan tuyg'usi va tabiat manzaralari
Matn Vatan tushunchasini tabiat manzaralari orqali ochib beradi: viqorli tog'lar, muzlar erimaydigan qoyalar, toshqin daryolar hosil qiluvchi tog' jilg'alari, poyonsiz cho'llar va ularni kesib o'tgan karvon yo'llari. Ushbu yo'llar kesishgan joylarda dunyoning turli mamlakatlaridan kelgan odamlar to'planib, savdo-sotiq qilishgan — bu O'rta Osiyoning qadimdan xalqaro savdo va madaniy aloqalar markazi bo'lganidan dalolat beradi. Bugungi kunda ham vodiylar, cho'l va tog'larda qadimgi shaharlar, qal'alar va ibodatxonalarning xarobalari saqlanib qolgan. Bu joylarni odamlar allaqachon tark etgan bo'lsa-da, qadimshunoslar (arxeologlar) ularni qayta "tiriltirib", o'tmish sirlarini ochib bermoqda.

2. Qadimgi tarixni kim o'rganadi?
Insoniyatning qadimgi tarixini turli sohalar olimlari o'rganadi: arxeolog — qadimgi manzilgohlarda qazishma ishlarini olib boruvchi olim; antropolog — qadimgi odamlarning suyak qoldiqlarini o'rganuvchi olim; etnograf — hozirgi xalqlarning urf-odat va an'analarini o'rganuvchi olim.

3. Qadimgi tarix bo'yicha manbalar
3.1. Moddiy (ashyoviy) manbalar — arxeologik qazishmalar davomida topilgan barcha narsalar: mehnat qurollari, sopol idishlar, qurol-yarog'lar, zeb-ziynat buyumlari. Qadimda inson qo'li bilan yaratilgan barcha narsalar ashyoviy manbalar jumlasiga kiradi.
3.2. Yozma manbalar — arxeologiya ma'lumotlari qadimgi dunyo tarixi haqida to'liq tasavvur berolmaydi, shu sababli olimlar yozma manbalarga ham murojaat qiladilar: "Avesto" kitobi, Behistun qoyasi yozuvlari (Eronda joylashgan), Gerodot, Strabon va Arrian kabi tarixchilarning asarlari.

4. Eng qadimgi tuzumni davrlashtirish
Jahondagi barcha xalqlarning tarixi ibtidoiy jamoa tuzumidan boshlangan. Insoniyat rivojidagi birinchi bosqich — kishilarning alohida guruhlarga birlashuvi bo'lib, bu eng qadimgi odamlarning dastlabki jamoasi edi.
4.1. Ijtimoiy tuzum bosqichlari — ibtidoiy jamoalar asta-sekin qarindosh urug'lardan iborat alohida urug' jamoalariga bo'lingan. Dastlab matriarxat (ona urug'i davri, ayol boshchiligidagi jamoa tuzumi) hukm surgan. Keyinchalik mehnat qurollari va xo'jalik yuritish shakllari takomillashgani sababli yetakchilik erkak kishiga o'tib, patriarxat (ota urug'i davri, erkak boshchiligidagi jamoa tuzumi) boshlangan.
4.2. Tosh davri bosqichlari — eng qadimgi odamlar dastlabki mehnat qurollarini toshdan yasagani uchun arxeologlar insoniyat tarixining boshlanishini "tosh davri" deb ataydilar. Bu davr to'rtta bosqichga bo'linadi: paleolit — qadimgi tosh davri (yunoncha "qadimgi"+"tosh"), mezolit — o'rta tosh davri (yunoncha "o'rta"+"tosh"), neolit — yangi tosh davri (yunoncha "yangi"+"tosh"), eneolit — mis-tosh davri (lotincha "mis"+yunoncha "tosh"). Paleolit o'zi yana ilk, o'rta va so'nggi davrlarga bo'linadi.

5. Asosiy tushunchalar lug'ati
Arxeolog — qadimgi manzilgohlarda qazishma ishlarini olib boruvchi olim
Antropolog — qadimgi odamlarning suyak qoldiqlarini o'rganuvchi olim
Etnograf — hozirgi xalqlarning urf-odat va an'analarini o'rganuvchi olim
Matriarxat — ona urug'i davri, ayol boshchiligidagi jamoa tuzumi
Patriarxat — ota urug'i davri, erkak boshchiligidagi jamoa tuzumi
Paleolit, Mezolit, Neolit, Eneolit — tosh davrining bosqichlari`,
    questions: [
      { q: "Qadimgi dunyo tarixi qaysi davrni o'z ichiga oladi?", opts: ["Iso payg'ambar tug'ilganidan to milodiy 476-yilda G'arbiy Rim imperiyasi qulaguniga qadar kechgan voqealar","Eng qadimgi shaharlar, yozuv, davlatlar tashkil topganidan to milodiy 476-yilda G'arbiy Rim imperiyasi qulaguniga qadar kechgan voqealar","Insonlarning ibtidoiy alohida guruhlarga birlashuvidan to 395-yilda Rim imperiyasining ikkiga bo'linguniga qadar kechgan voqealar","Yer yuzida odam paydo bo'lganidan to milodiy 476-yilda G'arbiy Rim imperiyasi qulaguniga qadar"], correct: 3 },
      { q: "Yer yuzida odam paydo bo'lganidan to milodiy 476-yilda G'arbiy Rim imperiyasi qulaguniga qadar kechgan voqealar tarix fanida qanday ataladi?", opts: ["Antik davr","Ibtidoiy davr","Qadimgi dunyo tarixi","Ilk o'rta asrlar tarixi"], correct: 2 },
      { q: "Qaysi olimlar qadim zamonlarda odamlar yashagan manzilgohlarda qazishma ishlarini amalga oshiradilar?", opts: ["Lingvistlar","Etnograflar","Antropologlar","Arxeologlar"], correct: 3 },
      { q: "Qaysi olimlar qadimgi odamlarning qoldiqlari (skelet va bosh chanoq)ni sinchiklab tekshirib, ularning tashqi ko'rinishini tiklaydilar?", opts: ["Lingvistlar","Etnograflar","Antropologlar","Arxeologlar"], correct: 2 },
      { q: "Qaysi olimlar qadimgi odamlarning ko'pgina udumlari, xo'jalik va madaniy an'analarini saqlab qolgan hozirda mavjud qabilalar va xalqlarni o'rganadilar?", opts: ["Lingvistlar","Etnograflar","Antropologlar","Arxeologlar"], correct: 1 },
      { q: "Moddiy manbalarga nimalar kiradi?", opts: ["Mehnat qurollari, sopol idishlar, qurol-aslahalar, zeb-ziynat buyumlari","Behistun yozuvlari, Gerodot, Strabon, Sim Syan asarlari","Taqinchoqlar, \"Avesto\" kitobi","Turli yilnomalar, qonunlar majmuyi, biografiyalar"], correct: 0 },
      { q: "Yozma manbalarga nimalar kiradi?", opts: ["Mehnat qurollari, sopol idishlar, qurol-aslahalar, zeb-ziynat buyumlari","Behistun yozuvlari, Gerodot, Strabon, Sim Syan asarlari","Taqinchoqlar, \"Avesto\" kitobi","Turli yilnomalar, turli taqinchoqlar, zargarlik buyumlari"], correct: 1 },

Hozirgi odam bir kunda paydo bo'lmagan — bu millionlab yillar davom etgan sekin va uzluksiz rivojlanish natijasidir. Sovuq iqlim, ov qilish zarurati va yashash uchun kurash odamlarni qurol yasashga, olovdan foydalanishga va jamoa bo'lib birgalikda yashashga majbur qilgan. Har bir yangi bosqichda odam tabiatga tobora kamroq bog'liq bo'lib, tobora aqlliroq va uddaburonroq bo'lib borgan.

- Ishbilarmon odam - Sharqiy Afrikadan topilgan, yoshi 2 million yildan oshadi. Toshdan o'ta sodda mehnat qurollarini yasashni bilgan - bu insoniyat tarixidagi ilk ongli mehnat faoliyati edi.

- Neandertal odamlar - Buyuk muzlik davri boshlangach, faqat eng chidamli va baquvvat odamlargina omon qolgan. Ular jamoa bo'lib birgalikda yashash, bir-birini himoya qilishni o'rgangan va o'liklarini dafn eta boshlagan - bu ilk diniy tasavvurlar paydo bo'lganidan dalolat beradi.

7. O'rta Osiyodagi eng qadimgi odamlar manzilgohlari
Selung'ur g'ori (Farg'ona vodiysi) - O'rta Osiyodagi eng qadimgi odam yashagan joylardan biri. Ko'lbuloq (Toshkent viloyati, Angren) - qadimiy tosh mehnat qurollari (chopperlar) topilgan manzilgoh. Teshiktosh g'ori (Surxondaryo, Boysun tog'lari) - neandertal bolasining dafn etilgan qoldiqlari topilgan joy, o'rta paleolit davriga (mil.avv. 100-40-mingyillik) oid.

9. Diniy e'tiqodlarning vujudga kelishi
Tabiat hodisalarini tushuntira olmagan qadimgi odamlar momaqaldiroq, yashin, shamol, yomg'ir kabi hodisalarga sig'ina boshlashgan. Ular tabiatni jonli deb hisoblab, uni inson xususiyatlari bilan bog'lab talqin qilishgan.

  guide: `1. Misr – Nil in'omi

O'zi bilan birga huzurbaxsh salqin havo va mo'l-ko'l hosilni olib keluvchi sersuv Nil daryosi viqor bilan oqadi. Ulug'vor daryo Afrika shimoli-sharqida sivilizatsiya vujudga kelishi uchun zamin yaratgan.

Nil uzunligi: 6 ming kilometr.
Vodiy kengligi: Daryoning quyi qismi 3 km dan 22 kilometrgacha kenglikdagi qora tuproqli serhosil dalalardan iborat.
Vodiyliklar yurtga «Qora tuproq» yoki «Nil in'omi» deb nom berishgan.

Qadim o'tgan zamonlarda Nil vodiysi odam o'tolmaydigan, papirus butalari bir-biriga chirmashib ketgan botqoqliklar bilan qoplangan edi. Suvda son-sanoqsiz yirtqich timsohlar kun kechirar, quruq yerlarda yovvoyi hayvonlar galasi sanqib yurar, botqoqliklarda esa zaharli ilonlar yashar edi.

Muhim sana: Mil. avv. 4-mingyillik boshlarida odamlar Nil daryosi qirg'oqlaridagi yerlarni o'zlashtirishga bel bog'laganlar.

Eslab qoling! Nil – Afrika shimoli-sharqida. Uzunligi 6 ming km. Kengligi 3–22 km. «Qora tuproq» yoki «Nil in'omi». Odamlar yerlarni o'zlashtirish – mil. avv. 4-mingyillik boshlari.

2. Misrliklarning mashg'ulotlari

Nil daryosi dalalarni suvga bostirib, keng-mo'l oqqan yillarda misrlik dehqonlarning hosili ham barakali bo'lgan.

Nimalar yetishtirilgan? Bug'doy va arpa; poliz ekinlari; kanop (undan gazlama to'qilgan); uzum, qovun, anor, xurmo, piyoz, bodring, loviya kabi meva va sabzavotlar.

Dehqonchilik usullari: Yerga omoch bilan ishlov berilib, urug' qo'lda sepilgan. Urug'likni yerga singdirish uchun qoramollarni daladan haydab o'tishgan. Sigir, qo'y-echki boqib, ho'kizlardan dala ishlarida foydalangan. Hosil yig'im-terimi boshlanganda boshoqlarni mis o'roqlar bilan o'rib olishgan. Bug'doy yoki arpa bog'lari ustidan hayvonlarni haydab o'tish orqali hosilni yanchishgan. Xirmonjoydan chiqqan don sopol xumlarda saqlangan — bu donni kemiruvchi zararkunandalardan himoyalagan.

Muhim! Don sopol xumlarda saqlangan – kemiruvchilardan himoya uchun. Mis o'roqlar bilan o'rilgan. Hayvonlar yordamida yanchilgan.

3. Hunarmandchilikning rivojlanishi

Qadimgi Misr hunarmandlarining 30 dan ziyod kasb-korlari bo'lgan: misgarlar, kulollar, quruvchilar, duradgorlar, kemasozlar, to'quvchilar, tikuvchilar, zargarlar va boshqalar.

Uylar qanday qurilgan? Oddiy misrliklar uyi – loy suvalgan papirus poyalaridan. Zodagonlar uyi – oftobda quritilgan xom g'ishtdan. Fir'avnlar saroylari va ibodatxonalar – toshdan barpo etilgan.

Eslab qoling! 30 dan ziyod kasb-kor. Oddiy uy – papirus poyalari. Zodagon – xom g'isht. Fir'avn saroyi va ibodatxona – tosh.

4. Misr davlatining tashkil topishi

Odamlar mil. avv. 4-mingyillik oxirida Nil vodiysidagi sermashaqqat turmush sharoitiga moslasha boshladi. Tarqoq manzilgohlar «nom» deb atalgan kichik davlatlarga birlashdi, ularni nomarxlar boshqargan. Vaqt o'tishi bilan qabila sardorlari hukmdor – podsholarga aylandi.

Misrda ikkita podsholik bo'lgan: Quyi (Shimoliy) Misr va Yuqori (Janubiy) Misr. Mil. avv. 3000-yilda ikkala davlat o'rtasida boshlangan urushda Yuqori Misr hukmdori Menes g'alaba qozondi. U birlashgan mamlakatning birinchi hukmdori – fir'avni bo'ldi. Yangi poytaxt: Memfis shahri barpo etildi.

Misr aholisi uchun din kundalik turmushning ajralmas bir bo'lagi hisoblangan.

Ma'budlar qanday tasavvur etilgan? Qadimgi misrliklar ma'budlar hayvonlar qiyofasiga kirib olib (mushuk, qo'y, ho'kiz, arslon, sigir ko'rinishida) odamlar orasida yashaydi deb hisoblagan. Ma'budlarning bir qancha joni mavjud deb o'ylashgan: ulardan biri hayvon tanasida, boshqasi esa haykalida yashaydi.

Kohinlarning vazifasi: Kohinlar — ibodatxona ruhoniylari — ma'budlarni dindorlar in'om tariqasida keltirgan narsalar bilan boqishadi deb hisoblashgan.

Asosiy ma'budlar: Qadimgi Misr podsholigining poytaxti Memfisning o'z ma'budi — Ptax bo'lgan. Misrliklar e'tiqodicha, Ptax olamni yaratayotganida har bir narsaning nomini odamga o'rgatgan. Ptax shunchalik qudratliki, uni asl qiyofasida ko'rishning iloji yo'q. Shuning uchun Ptaxning Yer yuzidagi qiyofasi Apis bo'lib, u peshanasi va belida oq qashqasi bo'lgan qora ho'kiz timsolida tasavvur qilingan.

Quyosh ma'budi Amon-Ra fir'avnlarning bosh ilohi va homiysi hisoblangan. Dastlab ikkita ma'bud bo'lgan: Fiva shahri homiysi Amon va Quyosh ma'budi Ra. Keyin ikkalasi yagona ma'budga birlashgan. Amon-Raning ibodatxonasi Geliopolda (Baolbek) bo'lgan. Fir'avnlar Quyosh ma'budi o'g'illaridir — hukmdorlar hamma ishni o'zining samoviy otasi amri bilan amalga oshiradi degan qarash mavjud bo'lgan.

Xapi — Nil ma'budi, Misrdagi hayotning birlamchi manbai va posboni, shuningdek Osiris taxtining himoyachisi sanalgan. Osiris — yerosti saltanati ma'budi hisoblangan.

  guide: `1. Piramidalar nima edi?

Qadimgi va O'rta podsholiklar davrida misrliklar barpo etgan ulkan piramidalar fir'avnlar dafn etiladigan joy — maqbaralar bo'lgan. O'tgan mingyilliklar davomida ko'pdan ko'p shaharlar va davlatlar yo'q bo'lib ketdi, ibodatxonalar va saroylar xarobaga aylandi. Lekin piramidalar vaqtdan qo'rqmaydi. Faqat piramidalargina to'rt ming yildan oshiq vaqt davomida o'zgarmasdan turibdi.

2. Eng mashhur piramidalar

Memfis shahri yaqinida uch fir'avn — Xufu, Xafra va Menkauralar uchun bunyod etilgan piramidalar eng mashhur inshootlardir. Bu piramidalar jahonning yetti mo'jizasidan biri hisoblanib, ular hozirga qadar saqlanib qolgan.

3. Xufu (Xeops) piramidasi — eng katta piramida

Eng katta piramida Xufu uchun (yunonlar uni Xeops deb atashgan) mil. avv. 2600-yil atrofida qurilgan. Balandligi 147 metr. Tosh bo'laklari — har biri ikki tonnadan og'irroq bo'lgan 2,5 million dona tosh. Toshlar orasidagi yoriq 0,5 millimetrdan oshmaydi (shunchalik tekis qilib kesilgan va taroshlangan).

4. Daxmalar va bitiklar

Daxmalar ichi munojotlar va qarg'ishlardan iborat bitiklar bilan qoplangan. Ular fir'avnni himoya qilishi va o'zga hayotga o'tayotganida unga yordam berishi kerak bo'lgan.

Piramidalarni sfinks — tanasi sherniki, boshi odamniki bo'lgan ulkan haykal qo'riqlaydi. «Sahro shohi» — sfinks haykali toshdan ishlangan bo'lib, balandligi 20 metrga teng.

Qadimgi misrliklar yozuvi insoniyatning ilk yozuvlaridan biri edi. Dastlab har bir so'z rasm ko'rinishida yozilgan. Yozuvdan duolar va marosimlarni yozib borishda foydalanilgan, shuning uchun u «muqaddas kalom» yoki «ma'budlar kalomi» deb nomlangan. Qadimgi yunonlar bu yozuvni «iyerogliflar» deb atashgan — bu so'z «muqaddas bitiklar» ma'nosini anglatadi.

Yozuvlar maqbaralarning devorlariga va ma'budlar haykallariga o'yib yozilgan, shuningdek tosh va sopoldan ham foydalanilgan. Misrliklar alifbosi 750 iyeroglifdan iborat bo'lgan, shu sababli savod chiqarish ko'pchilikka nasib etavermagan.

Iyerogliflarni qamish qilqalam bilan papirusga yozishgan, turli rangdagi mineral bo'yoqlar siyoh vazifasini o'tagan. Ta'lim olayotganda esa sopol idishlar parchasiga yoki ohaktoshga yozishgan. Husnixat san'atini egallagan kishilar yuksak savodxon sanalib, katta imtiyozlarga ega bo'lgan — bu holat aynan Misrda kuzatilgan.

2. Iyerogliflar sirining kashf etilishi

Taniqli fransuz olimi Jak-Fransua Shampolyon 1822-yilda qadimiy Misr matnlarini o'qishga muvaffaq bo'ldi. Bunga Qohira yaqinidagi Rozett shahri yaqinidan topilgan, qadimgi misr va qadimgi yunon tillarida bir xil ma'noda bitilgan tosh sababchi bo'ldi. Matnlarni taqqoslab, har bir iyeroglifning ma'nosi tushuntirildi. Shu kashfiyotdan keyin papiruslar, ibodatxonalar va piramidalar devorlaridagi bitiklar «tilga kirdi». Hozirda Rozett bitiktoshi Londondagi Britaniya muzeyida saqlanmoqda.

3. Astronomiya va taqvim

Ziroatkorlar urug'likni yerga qachon qadash va hosilni qachon yig'ishtirishni bilishi zarur edi. Ular bu muddatlarni yulduzlarga qarab aniqlagan — shu tariqa astronomiya fani vujudga keldi. Misrliklar yil davomiyligini 365 kun deb belgiladi va dunyodagi birinchi taqvimni tuzdi: 365 kunni 30 kundan 12 oyga taqsimladi, ortib qolgan 5 kunni esa bayram kunlari sanab hisobga kiritmadi.

4. Geometriya va matematika

Anhorlar qazilganda, imorat va inshootlar barpo etilganda maydonni o'lchash zarur edi — shu tariqa geometriya, ya'ni yer yuzasini o'lchash ilmi dunyoga keldi. Misrliklar oddiy arifmetik hisoblashni, kasrlarni va murakkab hisob-kitoblarni bilishgan, matematika ana shu asosda taraqqiy etdi.

5. Tibbiyot va o'lchov birliklari

Mumiyolangan mayitlarni tayyorlash jarayonida odamning ichki tuzilishi yaxshi o'rganilgan. Davolashda giyohlar damlamasi, ma'danli suvlar va tuzdan keng foydalanilgan, Misr shaharlarida esa tabiblarga ta'lim beruvchi maxsus maktablar bo'lgan.

Asosiy o'lchov birligi «tirsak» deb nomlangan. Qo'llar uzunligi turlicha bo'lgani uchun yagona o'lchov — «podsho tirsagi» joriy etilgan, u 52,5 santimetrga teng bo'lgan.

6. Vaqt o'lchash

Vaqt 24 ta bo'lmaga ajratilgan maxsus idishdan iborat suv soatlari yordamida o'lchangan. Bir bo'lmadan ikkinchisiga oqib o'tgan suv hajmi bir soat deb hisoblangan.

  guide: `1. Mesopotamiya nomi va joylashuvi

Mesopotamiya nomi Dajla va Frot daryolari oralig'idagi vodiyga nisbatan ishlatilgan. Bu atamani yunonlar bergan. «Mesopotamiya» so'zi «ikki daryo oralig'i» degan ma'noni anglatadi. Odamlar Mesopotamiyaga qadim zamonlarda kelib o'rnashgan.

2. Tabiiy sharoiti

Mesopotamiyaning tabiiy sharoiti Misrnikiga o'xshash bo'lgan: daryolarning toshqin suvlari ishlov berish uchun qulay, serunum yerlar yaratgan. Qishda surunkali yomg'ir va daryolar toshqini bo'lib turgan.

3. Aholi: Shumerlar va Akkadlar

Mil. avv. 4-mingyillikda Mesopotamiyada shumerlar manzilgohlari va shaharlari vujudga kela boshladi. Janubiy Mesopotamiya — Shumer deb atalgan (shumerlar yashagan), Shimoliy Mesopotamiya esa — Akkad deb atalgan (akkadlar yashagan).

4. Aholining asosiy mashg'uloti va savdo-sotiq

Mesopotamiya aholisining asosiy mashg'uloti — dehqonchilik bo'lgan. Dajla va Frot daryolarining har yilgi toshqinlari mahalida suv bilan birga dalalarga unumdor loyqa oqib kelgan. Mesopotamiyada yog'och va metall kabi xo'jalik uchun zarur materiallar bo'lmagan, ammo don mo'l-ko'l yetishtirilgan va chorva mollari ko'p bo'lgan, shuning uchun aholi savdo-sotiq bilan ham shug'ullangan.

Qo'shni Kavkazorti va Eron o'lkalaridan donga ayirboshlab oltin, mis, kumush, qalay va noyob toshlar keltirilgan. Metall buyumlar, zeb-ziynatlar, qurol-yarog' va kulolchilik buyumlari ayniqsa qadrlangan. Savdo-sotiqda kumush quymasi ko'rinishidagi metall tangalar ishlatilgan. Mesopotamiyadagi og'irlik o'lchovi — «mino» 550 gramm kumushga barobar bo'lgan.

5. Mixxat yozuvi

Shumerlar jahondagi eng qadimgi yozuvlardan biri — mixxatni ixtiro qilgan. Ular uchi o'tkirlangan tayoqchalar bilan loy taxtachalarga yozgan.

6. Qadimiy shahar-davlatlar, hokimiyat va ma'budlar

Mil. avv. 4-mingyillik oxirida Mesopotamiyada Uruk, Umma, Lagash, Ur va boshqa shaharlar vujudga kela boshladi. Ular shahar va unga tutash dehqonchilik tumanlaridan iborat shahar-davlatlar edi. Har bir shaharda oliy ma'bud nomidan kohinlar hukmronlik qilgan, ibodatxonalar esa davlatdagi hokimiyat markazi bo'lgan. Mesopotamiyaning qadimiy ibodatxonalari — zikkuratlar bo'lib, ular xom g'ishtdan terib chiqilgan muhtasham zinapoyali inshootlar edi.

Asosiy ma'budlar: Shamash — Quyosh ma'budi (oliy hakam, yovuz ishlari uchun odamlarni sud qilgan), Sin — Oy ma'budi, Ea — Suv ma'budi, Ishtar — hosildorlik, sevgi, urush va g'alaba ma'budasi.

Mesopotamiyaning katta yer-mulklari hukmdorlar va kohinlar qo'l ostida bo'lgan. Dalalarga qullar va erkin yollanma ishchilar ishlov bergan. Qurilish tosh, xom va pishgan g'isht bilan amalga oshirilgan.

7. Gilgamish haqidagi rivoyat

Mesopotamiya rivoyatlarining eng sevimli qahramoni — Gilgamish, u Uruk shahri podshosi bo'lgan. Afsonaga ko'ra, jarga uloqtirilgan Gilgamishni burgut qutqarib oladi va uni bog'bonga eltib beradi. Gilgamish do'st tutingan pahlavonning nomi — Enkidu. Ikkalasi bir bo'lib yovuz maxluqotlarga qarshi kurashadi, buning uchun ma'budlar Enkiduni jazolaydilar va u halok bo'ladi.

Boqiy hayotga erishish uchun Gilgamish dengiz tubida o'sadigan sehrli giyoh — mehrigiyoni izlab topadi, lekin uni ilon o'g'irlab ketadi. Gilgamish oxir-oqibat jonajon shahri devorlarini himoya qilishi va ezgu ishlarini umrboqiy qilishini tushunib yetadi.

8. Akkadning yuksalishi — Sargon I

Mil. avv. 3-mingyillikning ikkinchi yarmida Akkad podshosi Sargon I Akkadni va Shumer shaharlarini o'z hokimiyati ostiga birlashtiradi. Savdo-sotiqni rivojlantirish maqsadida Sargon I barcha shaharlar uchun yagona bo'lgan uzunlik, maydon va og'irlik o'lchovini joriy etadi. U jahon tarixida birinchi bo'lib muntazam qo'shin (5400 jangchidan iborat) tuzadi va «To'rt iqlim mamlakatlari podshosi» unvoniga sazovor bo'ladi.

  guide: `1. Bobil — «Xudolar darvozasi»

Mil. avv. II mingyillikda Bobil podsholigi Mesopotamiya janubidagi eng yirik va qudratli davlatga aylandi. Bobil Frot va Dajla daryolari o'zanlari bir-biriga yaqinlashib ketadigan hududda joylashgan. Kemalarda turli mahsulotlar bilan suzib kelgan savdogarlar bu shaharga to'xtab o'tishar edi. «Bobil» so'zi «xudolar darvozasi» degan ma'noni anglatadi.

Bobil shahrida ajoyib saroylar, muhtasham ibodatxonalar bo'lgan. Bobilning bosh ko'chasi g'alaba ma'budasi Ishtar darvozasidan boshlangan. Bobil davlatida dehqonchilik, hunarmandchilik, ishlab chiqarish va savdo-sotiq rivojlangan, ammo o'zaro urushlar bunga xalaqit berardi.

2. Xammurapi va uning qonunlari

Mil. avv. XVIII asrda Bobil podshosi Xammurapi butun Mesopotamiyani yagona davlatga birlashtirishga muvaffaq bo'ladi. Xammurapi hukmronligi davrida Bobil eng qudratli davlatga aylanadi. U tarixda qonunlar tuzuvchi hukmdor sifatida nom qoldirgan. Xammurapi qonunlari hamma uchun — badavlat va qashshoq kishilar uchun birdek bo'lgan. Qonunlarning matnlari mamlakatning barcha shaharlarida o'rnatilgan tosh ustunlarga yozib qo'yilardi.

Qonunlardagi jazolar: shifokor jarrohlik muolajasi natijasida bemor vafot etsa — qo'llari kesib tashlanadi; binokor qurgan uy qulab kishi o'lsa — binokor qatl etiladi; yong'in mahalida o'g'rilik ustida qo'lga tushsa — o'sha zahoti olovga tashlanadi; qulfbuzar o'g'ri o'zganing mulkiga tajovuz qilgan joyida o'ldiriladi va o'sha yerning o'zida ko'mib yuboriladi.

Xammurapi qonunlari nomigagina podshoning qarori bo'lmasdan, ma'budlar xohish-irodasi sifatida talqin etilgan, shuning uchun ularni so'zsiz, og'ishmasdan bajarish talab qilinardi. Bu qonunlar jamiyat rivojiga katta imkoniyat yaratib berdi, chunki talon-tarojlik va o'g'rilik kabi jinoyatlar deyarli sodir etilmasdi.

3. Yangi Bobil podsholigi

Miloddan avvalgi VII asrda Yangi Bobil podsholigi vujudga kelgan. Navuxodonosor II hukmronligi davrida Yangi Bobil podsholigi o'z ravnaqining cho'qqisiga erishadi: u Misrni Yangi Bobil podsholigiga qo'shib oladi, Iyerusalim (Quddus)ni vayron qilib tashlaydi, Bobilni mustahkam qal'aga aylantiradi va turarjoy binolari hamda mudofaa devorlari qurilishida pishgan g'isht ishlatish to'g'risida farmon beradi.

U hukmronlik qilgan davrda Bobil shahrining sakkizta darvozasi bo'lgan, har biri mamlakat bosh ma'budlaridan birining nomi bilan atalgan. Ma'buda Ishtar nomidagi darvoza afsonaviy hayvonlar tasviri tushirilgan naqshinkor tosh taxtachalar bilan bezatilgan.

Qadimgi forslar lashkari mil. avv. 539-yilda Bobilga bostirib kiradi va shaharni zabt etadi. Shu paytdan boshlab Yangi Bobil podsholigi Fors davlati tarkibiga kiradi.

4. Bobil madaniyati

Shumer va Akkad Bobil madaniyatining eng qadimiy o'choqlari edi. Hukmdorlar saroylari va ibodatxonalarda zodagonlar hamda badavlat oilalarning farzandlari ta'lim oladigan maktablar tashkil qilingan. O'quvchilar nam loy taxtachalarga suyak va yog'ochdan yasalgan tayoqchalar bilan yozishgan; taxtachalar oftobda quritilib, so'ng xumdonlarda pishirilgan.

  guide: `1. Ossuriya podsholigi

Ossuriya podsholigi mil. avv. 2-mingyillikda Old Osiyo hududida vujudga kelgan. Qadim zamonlarda ossuriyaliklar Frot va Dajla daryolari yuqori oqimidagi kichik hududni egallagan — bu yer hozirgi Iroq hududiga to'g'ri keladi.

Ossuriyaning dastlabki poytaxti — Ashshur shahri bo'lgan, keyinchalik poytaxt Nineviya shahriga ko'chirilgan. Ossuriya aholisining asosiy mashg'ulotlari dehqonchilik va savdo-sotiq edi.

Ossuriyaliklar jangari xalq bo'lgan, qo'shni yerlarga tez-tez hujum qilib turardi. Ularning qudratli lashkari har yili yangi yerlarni zabt etishga otlanar edi, bo'ysundirilgan xalqlar esa Ossuriya hukmdoriga katta miqdorda o'lpon to'lagan.

Ossuriya poytaxtida ulug'vor saroylar va ibodatxonalar mavjud bo'lgan. Ashshurbanipal hukmronligi yillarida Nineviyada sopol taxtachalardan iborat yirik kutubxona jamlangan edi — bu kutubxona Old Osiyodagi eng yirik kutubxonalardan biri bo'lgan.

Asta-sekin Ossuriya davlati zaiflashib bordi. Mil. avv. 605-yilda Ossuriya qo'shinlari Midiya va Bobil tomonidan tor-mor etilganidan keyin davlat ham zavolga yuz tutdi.

2. Urartu podsholigi

Urartu davlati Kavkazortida, hozirgi Turkiyaning sharqiy qismida va Armaniston hududlarida joylashgan, aholisini urartlar deb atashgan. Urartu davlatining tashkil topishini tezlashtirgan asosiy sabab — Ossuriya hujumlaridan himoyalanish zarurati edi.

Urartu davlati mil. avv. IX–VIII asr boshlarida gullab-yashnadi. Tushpa shahri Urartu davlati poytaxtiga aylandi. Urartlar bir necha marta bosqinchilik yurishlariga chiqdilar va ossuriyaliklar ustidan g'alaba qozondilar, ammo keyinroq ossuriyaliklar qo'shini urartlar qo'shinini tor-mor etdi.

2. Elam davlati

Eronning janubi-g'arbiy qismida, Mesopotamiya bilan chegarada Elam davlati vujudga keladi. Bu davlatning poytaxti Suza shahri bo'lgan. Elamda jahondagi eng qadimiy yozuvlardan biri yaratilgan.

3. Midiya davlati

Kaspiy dengizidan janubi-g'arbda Midiya joylashgan. Mil. avv. VII asrda podsho Kiaksar hukmronligi davrida Midiya qudratli davlatga aylanadi. Midiya davlati Bobil bilan ittifoq bo'lib, Ossuriyani bosib oladi.

4. Fors viloyati va Ahamoniylar sulolasi

Eronning janubida, Fors ko'rfaziga tutashib ketgan yerlarda Fors viloyati — qadimgi forslar o'rnashgan o'lkada davlat vujudga kelgan.

5. Kir II — Fors hukmdori

Mil. avv. 558-yilda Ahamoniylar sulolasidan bo'lmish podsho Kir II barcha forslarni o'z hokimiyati ostida birlashtirdi. Midiya podsholigini bo'ysundirganidan so'ng Kir II ulkan lashkar tuzdi va bosqinchilik yurishlarini davom ettirdi. Armaniston, Midiya va Bobil zabt etildi. Forslar O'rta Yer dengizi sohiliga chiqib, Falastin va Finikiyani bo'ysundiradi.

Kir II ning istilochilik siyosatini vorislari — Kambiz II va Doro I ham davom ettirdi. Kambiz II Misrni zabt etish orqali Fors davlati hududini nihoyatda kengaytirdi. Ahamoniylar davlati jahondagi eng yirik davlatlardan biri bo'lgan.

6. Doro I islohotlari

Mil. avv. 522-yilda shoh Doro I qadimgi Fors davlati taxtiga chiqdi. Bu paytda bosib olingan barcha mamlakatlarda qo'zg'olonlar alangalanib ketdi, Doro I ularni bostirishga kirishdi. Doro I Qora dengiz bo'ylarida yashovchi skiflar ustiga yurish qildi.

7. Qadimgi forslar madaniyati

Suza, Ekbatana va boshqa shaharlar Ahamoniylar davlatidagi muhim savdo markazlari bo'lgan. Persepol shahrida Doro I va Kserksning turli xonalar va yuz ustunli zal bo'lgan saroyining qoldiqlari saqlanib qolgan. Saroy afsonaviy va xayoliy qushlar tasviri bilan bezatilgan edi.

8. Fors davlatining qulashi

Makedoniyalik Aleksandr mil. avv. 330-yilda Fors davlatini bosib oldi.

Qadimgi Hindistonda ilm-fan, xususan, astronomiya va matematika sohalari juda yuqori darajada rivoj topgan. Hind olimlari tabiatni kuzatib, ko'plab muhim kashfiyotlar qilganlar.

Hind astronomlari Quyosh, yulduzlar va sayyoralar harakatini diqqat bilan o'rganganlar. Ularning kuzatuvlari natijasida yilning uzunligini aniqlashga muvaffaq bo'lishgan. Shuningdek, hindlar Oy yog'dusi uning sirtiga tushgan Quyosh nurining akslanishi ekanligini bilganlar — bu o'sha davr uchun katta ilmiy yutuq hisoblanadi.

Hindlar sanash va hisoblash tizimini keng qo'llaganlar, juda katta raqamlarni bildiruvchi alohida belgilarni ishlatganlar. Bugungi kundagi raqamlar tizimi ham hindlardan kelib chiqqan deb hisoblanadi.

Hindlar yil hisobining 360 kundan iborat taqvimini tuzganlar, bu taqvim ularning astronomik kuzatuvlariga asoslangan edi.

Qadimgi Hindistonda tibbiyot sohasi ham rivoj topgan. Yozma manbalarda turli xil kasalliklar va jarrohlik asboblari tilga olingan. Hind tabiblari kasalliklarni davolashda shifobaxsh dorilardan (o'simliklardan) foydalanganlar.

Hindistonda ixtiro qilingan mashhur o'yin — shaxmat. Hindlarning o'zlari bu o'yinni «qo'shinlarning to'rt turi» deb ataganlar. Bugungi kunda shaxmat butun dunyoda mashhur.

Qadimiy hind tillari asosida yangi adabiy til — sanskrit ishlab chiqilgan. Ana shu tilda «Mahabharata» va «Ramayana» dostonlari yozilgan. Bu asarlar bugungi kungacha saqlanib qolgan va hind madaniyatining muhim yodgorliklari hisoblanadi.

2. «Xudolarsiz din» — Buddaviylik

Jamiyatdagi o'zgarishlar ta'sirida hindlarning diniy e'tiqodlari ham o'zgara boshladi. Miloddan avvalgi VI asrda yangi din — buddaviylik paydo bo'ldi.

Buddaviylik dinining yaratilishi Siddhartha Gautama nomi bilan bog'liq. U keyinchalik Budda (ma'rifatga erishgan) taxallusini olgan. Siddhartha Gautama hukmdorning o'g'li edi.

Budda inson son-sanoqsiz marta tug'iladi va vafot etadi, deb hisoblagan. Keyingi hayotda odamning kim bo'lib tug'ilishi uning sa'y-harakatlari va amallariga bog'liq. Buddaviylar inson yolg'on so'zlamasligi, mol-davlat to'plamasligi, tirik mavjudotlar qonini to'kmasligi kerak, deb o'rgatganlar. Ularning fikricha, har qanday xohish-istak azob-uqubatga olib keladi, shuning uchun inson xohish-istaklaridan voz kechishi lozim.

Avvaliga buddaviylik e'tiqodida ma'bud (xudo) bo'lmagan, chunki buddaviylar ma'budlar inson azob-uqubatlarini yengillashtira olmaydi, deb hisoblaganlar. Shu sababli hindlar buddaviylikni «xudolarsiz din» deb atashgan. Keyinchalik esa Buddaning o'ziga sig'inish boshlangan. Bodh Gaya ziyoratgohi va Mahabodhi ibodatxonasi Hindistonda joylashgan.

Yozma manbalarning guvohlik berishicha, miloddan avvalgi VII–VI asrlarda O'zbekiston hamda qo'shni hududlarda sug'diylar, baqtriyaliklar, xorazmliklar kabi elatlar, shuningdek, sak va massaget qabilalari yashagan.

Sug'diylar — Zarafshon va Qashqadaryo vohasida yashagan; yunon manbalarida bu hudud Sug'diyona deb atalgan. Baqtriyaliklar — Surxon vohasi, shimoliy Afg'oniston va janubiy Tojikistonda yashagan; yunon-rim manbalarida Baqtriana yoki Baqtriya deb atalgan. Xorazmliklar — Amudaryoning quyi oqimida yashagan o'troq dehqon elatlari; yunon manbalarida Xorasmiya deyilgan.

Massagetlar — cho'llar va Amudaryo bo'ylarida yashagan ko'chmanchi qabilalar. Saklar — O'rta Osiyoning tog'lik, dasht va cho'l yerlarida yashagan, asosiy mashg'uloti chorvachilik bo'lgan.

2. Mil. avv. VII–VI asrlarda xo'jalikning rivoji

Bu paytlarda Sug'd, Baqtriya va Xorazm aholisining asosiy mashg'uloti sun'iy sug'orishga asoslangan dehqonchilik bo'lgan. Hunarmandchilik va savdo-sotiq ham ancha rivoj topgan.

Manzilgohlardan yuqori sifatli kulolchilik idishlari, temir va bronza buyumlar topilgan. Tog'lardan mis, qalay, kumush va oltin ma'danlari, shuningdek, zargarlik buyumlari yasash uchun lojuvard (la'l) va feruza kabi qimmatbaho toshlar qazib olingan — lojuvard Baqtriya tog'laridan olingan.

Ko'chmanchi sak va massaget qabilalarining asosiy mashg'uloti chorvachilik bo'lib, ular tuya, ot, qo'y va echkilar podalarini boqqan. Chorvadorlar hayvon terisidan charm, junli matolardan poyabzal, kiyimlar va chodirlar tikishgan. Ko'chmanchilar ushbu mahsulotlarni o'troq dehqonlarga sotgan — O'rta Osiyoning o'troq va ko'chmanchi xalqlari o'rtasidagi ayirboshlash muvaffaqiyatli kechgan.

3. Qadimgi shahar madaniyati

Hunarmandchilik va savdoning rivojlanishi natijasida mil. avv. VII–VI asrlarda qadimgi shaharlar rivojlangan. Ular hunarmandchilik ishlab chiqarish va savdo markazlari bo'lgan.

O'rganilgan qadimiy shaharlar: Afrosiyob (Samarqand), Ko'ktepa (Zarafshon vohasi), Yerqo'rg'on va Uzunqir (Qashqadaryo vohasi), Ko'zaliqir (Xorazm), Qiziltepa (Surxondaryo vohasi).

Qadimiy shaharlarda ulkan ichki qal'a, xom g'ishtdan qurilgan xonadonlar, hunarmandchilik ustaxonalari bo'lgan. Qo'rg'onda turli xonalardan iborat katta saroy joylashgan. Mudofaa devorlari, burjlar, o'q otish uchun shinaklar va darvoza oldidagi suv bilan to'ldirilgan xandaq shaharni himoya qilgan.

4. Baqtriya davlati

Mil. avv. VII asrda tashkil topgan Baqtriya davlati O'rta Osiyo hududidagi qadimgi davlatlardan biri sanaladi. Marg'iyona va Sug'd Baqtriyaning siyosiy va madaniy ta'sirida bo'lgan, shu sababli u turli qadimgi qardosh xalqlarning davlat birlashmasi hisoblanadi.

Ktesiy — qadimgi yunon tarixchisi (mil. avv. V–IV asrlar). U uzoq muddat qadimgi fors shohi Artakserks saroyida yashab, saroy tabibi bo'lgan. Ktesiy Ossuriya podshosi Ninning Baqtriyaga yurishi haqida hikoya qiladi.

Ktesiyning yozishicha, Baqtra shahri qal'asi va devorlarining mustahkamligi bilan ajralib turgan. Podsho Oksiart qurol ko'tarishga qodir barchani jangga safarbar qilgan. Baqtriyaliklar ossuriyaliklarni chekinishga majbur qilib, tog' etagigacha quvib, yuz ming nafar dushman qo'shinini qirib tashlagan.

5. Xorazmdagi qadimiy davlat tizimi

Qadimiy davlat tizimi Xorazm hududida ham tashkil topgan. Xorazm vohasining yirik markazlaridan biri mustahkam mudofaa devorlari bilan o'rab olingan Ko'zaliqir qal'asi o'rnida joylashgan.

Mil. avv. VI asrda xorazmliklar ushbu qal'ada katta saroy qurishgan. U turli xonalar va yog'och ustunli zallardan iborat bo'lgan. Saroy yaqinida arpa va bug'doyni saqlash uchun mo'ljallangan yirik g'alla omborxonasi bunyod etilgan.

Voha aholisi dehqonchilik va chorvachilik bilan shug'ullangan. Qadimgi Xorazmda hunarmandchilik, binokorlik va savdo-sotiq yuksak darajada rivojlangan. Mahalliy kulolchilik, qurolsozlik, zargarlik buyumlarining dovrug'i o'zga yurtlarga ham tarqalgan. Xorazmliklar mohir quruvchi va hunarmand bo'lganlar.

  guide: `1. Zardushtiylikning vujudga kelishi

O'rta Osiyoda zardushtiylik deb atalgan din miloddan avvalgi 1-mingyillikda keng tarqaldi. Bu din hali odamlar tabiatni ilohiylashtirgan davrda kurtak yoza boshlagan edi. Zardushtiylar olov (quyosh), yer, suv va yulduzlarga sig'ingan va ularni ilohiy deb hisoblagan.

«Zardushtiylik» so'zi Zaratushtra (Zardusht) nomi bilan bog'liq. U mil. avv. 1-mingyillikning birinchi choragida yashab o'tgan tarixiy shaxsdir. Keyinroq Yunonistonda uning ismini «Zoroastr» deb atashgan (yunoncha astron — «yulduz»), negaki Yunonistonda uni donishmand va munajjim deb hisoblashgan. Shu nomdan ta'limotning o'zi ham zoroastrizm (zardushtiylik) deb atala boshlagan.

2. Zardusht haqidagi afsona

Zardushtiylikning paydo bo'lishi haqida quyidagi afsona mavjud: bir kuni Zardusht suv olish uchun erta tongda daryo bo'yiga keladi. Zilol suvda u Ahuramazda vakillaridan birining siymosini ko'rib qoladi. Siymo nur bilan qaysi tomonga borishga yo'l ko'rsatadi. Zardusht sehrli nur izidan ergashadi va oliy iloh — Ahuramazda huzuriga yetib keladi.

Ahuramazda o'zining ezgu amallari haqidagi bilimlarni tarqatish uchun uni tanlaganini aytadi va ilohiy vakolat beradi. Shu tarzda Zardusht 30 yoshida yangi diniy ta'limotning targ'ibotchisiga aylanadi. Zardusht oldin turli qabilalarni istilochilarga qarshi kurashga birlashtirish uchun ularni birlikka da'vat qilgan.

3. Zardushtiylikning tarqalishi va «Avesto»

Zardushtiylik tarqala boshlagan paytlarda maxsus ibodatxonalar va duo matnlari yozilgan kitoblar bo'lmagan. Diniy marosimlar ochiq osmon ostida, gulxan yonida yoki uydagi o'choq olovi atrofida o'tkazilgan.

Zardushtning so'nggi va'zlari kohinlar tomonidan yod olib, dindorlarga o'qib berilgan. Uning vafotidan keyin bir necha asrlar o'tgach, barcha diniy marosimlar, madhiyalar va duolar bitta kitobga jamlandi. «Avesto» — zardushtiylar uchun muqaddas kitob, so'zning ma'nosi «qat'iy belgilangan qonun-qoidalar».

4. Zardushtiylik xudolari va ta'limoti

Zardushtiylar o'zlarining ehtiromli ma'budlariga e'tiqod qilishgan: Ahuramazda — zardushtiylarning ulug' va donishmand oliy xudosi. Mitra — Quyosh va yorug'lik ma'budi, o'tli chaqmoqlar yordamida u yovuzlik va o'lim ma'budi Ahriman bilan jang qiladi. Zardushtiylar yomg'irdan keyin hosil bo'ladigan kamalakka Mitraning o'q uzayotgan yoyi deb sig'inishgan. Anaxita — hosildorlik va suv ma'budasi.

Zardushtiylar hayotining tub ma'nosi: ezgu amal, ezgu so'z va ezgu fikr. Insonning eng asosiy burchi — adolatli turmush tarzi. Zardushtiylik e'tiqodiga ko'ra: yolg'on so'zlamaslik, aldamaslik, va'daga vafo qilish, faqat ezgu ishlarni amalga oshirish kerak edi.

5. Dafn marosimi

Shu sababli jasadni toshli va qumli tepaliklarda qoldirishgan — yirtqich qushlar va hayvonlar yeb ketishi uchun. Yomg'irlarda yuvilgan va oftobda poklangan suyaklarni maxsus sopol tobutchalar — ossuariylar (suyakdonlar)da dafn etishgan.

  guide: `1. Yunon shaharlari (polislar)

Yunonistonda dehqonchilik va hunarmandchilik rivoj topishi natijasida shaharlar soni ham ortib boradi. Yunon shaharlarining ko'pchiligi bir qancha manzilgohlar birlashishi yo'li bilan tashkil topadi.

Bunday shaharlar yunoncha «polis», ya'ni «shahar» deb atalgan. Ular shahar-davlatlarni tashkil etgan. Polislar hunarmandchilik va savdo-sotiq markazlari bo'lgan. Bozor shaharning katta maydonida joylashgan, u yerda qishloq xo'jaligi va hunarmandchilik mahsulotlari bilan savdo qilingan.

Barcha shahar-davlatlar o'z qo'shinlariga ega bo'lgan. Qo'shinlarning asosini og'ir qurollangan askarlar — goplitlar tashkil etgan. Ular to'rt burchak shaklni yuzaga keltiruvchi bir-biriga zich joylashgan qatorda jang qilgan. Bunday jangovar safga tizilish falanga deb atalgan.

2. Afina davlati

O'rta Yunonistonning janubi-sharqiy qismida Attika yarimoroli joylashgan. Mil. avv. 2-mingyillikda Attikaning g'arbiy qismida yunonlar Akropol, ya'ni «yuqori shahar» deb atalgan qal'a quradi. Bora-bora Akropol tevaragiga odamlar o'rnasha boshladi, shu tariqa Afina shahri vujudga keladi. Shaharda yashagan odamlarning asosiy qismini hunarmandlar va savdogarlar tashkil etgan.

Afina aholisi uchta katta guruhga bo'lingan: fuqarolar, chet elliklar (meteklar) va qullar. Ota-onasi ozod afinalik bo'lgan erkaklargina Afina fuqarosi bo'la olgan. Faqat fuqarolar barcha huquqlardan foydalangan, ular og'ir mehnat va salomatlikka zarar yetkazuvchi ishlardan ozod qilingan.

Afina mustahkamlanishi bilan dengiz savdosi ham rivoj topadi. Afinaning asosiy portiga aylangan Pirey bandargohidan mamlakatga qullar va xilma-xil tovarlar keltirilgan.

3. Afinada ta'lim

Afinada davlat maktablari bo'lmagan. Ota-onalar o'z bolalarini pedagogga haq to'lab o'qitgan — pedagog yunonchada «bolani yo'lda kuzatib boruvchi» ma'nosini anglatadi. Qonun bo'yicha faqat o'g'il bolalar uchun ta'lim olish majburiy bo'lgan.

Yetti yoshdan boshlab bolalarga yozuv va hisob o'rgatilgan. Mum surkalgan taxtachalarga harflarni bronza tayoqcha — stil bilan yozishgan. Aksariyat fuqarolar uchun ta'lim shundangina iborat bo'lgan.

4. Sparta

Mil. avv. XII asrda Janubiy Yunoniston (Lakonika) hududiga doriylar qabilasi bostirib kirdi. Ular mahalliy qabilalarni bo'ysundirib, Sparta davlatiga asos soldilar.

Spartaliklar qulga aylantirgan mahalliy aholi — ilotlar ham aslida yunonlar bo'lib, ular bilan bir tilda so'zlashgan. Ilotlar spartaliklardan qattiq nafratlanar edi. Bunday sharoitda hukmronlikni faqat kuch bilan saqlab qolish mumkin bo'lgan. Shuning uchun ham spartaliklar o'z davlatida alohida shart-sharoitlar yaratdi: hamma qat'iy intizomga amal qilar, intizomni buzganlar shafqatsiz jazolanardi.

Sparta urushga tayyorgarlik ko'rayotgan shaharga o'xshab qolgandi. Chet elliklar Spartaga kiritilmagan. Savdo-sotiq sust rivojlangan, san'at asarlari, chiroyli ibodatxonalar ham bo'lmagan. Hamma uylar bir-biriga o'xshatib qurilgan.

Ilotlar alohida spartaliklarning emas, balki butun boshli davlatning mulki hisoblanardi. Ilotlar alohida spartaliklar oilasi yeriga ishlov berib, chorvani boqishgan va boshqa ko'plab majburiyatlarni bajarishgan. Spartaliklar esa faqat harbiy ish bilan shug'ullangan.

function loadTopics() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    topics = raw ? JSON.parse(raw) : [];
  } catch (e) {
    topics = [];
  }
  let changed = false;
  BUILTIN_TOPICS.forEach(bt => {
    if (!topics.find(t => t.id === bt.id)) {
      topics.push(JSON.parse(JSON.stringify(bt)));
      changed = true;
    }
  });
  if (changed) saveTopics();
}
function saveTopics() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(topics));
}

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function goHome() {
  renderHome();
  showScreen("screen-home");
}

function renderHome() {
  const totalQ = topics.reduce((sum, t) => sum + t.questions.length, 0);
  document.getElementById("bigTestDesc").textContent =
    totalQ > 0 ? `Barcha mavzulardan yig'ilgan ${totalQ} ta savol` : "Hozircha savollar yo'q — avval mavzu qo'shing";
  document.getElementById("bigTestCard").style.opacity = totalQ > 0 ? "1" : "0.5";
  document.querySelector("#bigTestCard button").disabled = totalQ === 0;

  const list = document.getElementById("topicList");

    list.innerHTML = `<div class="empty-box">Hali mavzu qo'shilmagan.<br>Yuqoridagi tugma orqali birinchi mavzuni yarating.</div>`;

  }
  list.innerHTML = topics.map(t => `

</div>
      <div class="chev">›</div>
    </div>
  `).join("");
}

function escapeHtml(s) {
  const d = document.createElement("div");
  d.textContent = s;

}

  editingId = null;

  document.getElementById("f-region").value = "markaziy";
  document.getElementById("f-guide").value = "";

  addQuestionBlock();
  showScreen("screen-form");
}

function editTopic() {
  const t = topics.find(x => x.id === currentTopicId);
  if (!t) return;
  editingId = t.id;
  document.getElementById("formHeading").textContent = "Mavzuni tahrirlash";
  document.getElementById("f-title").value = t.title;
  document.getElementById("f-region").value = t.region;
  document.getElementById("f-guide").value = t.guide;
  document.getElementById("qBuilder").innerHTML = "";
  t.questions.forEach(q => addQuestionBlock(q));
  if (t.questions.length === 0) addQuestionBlock();
  showScreen("screen-form");
}

let qBlockCounter = 0;
function addQuestionBlock(existing) {
  qBlockCounter++;
  const id = "qb" + qBlockCounter;
  const q = existing || { q: "", opts: ["", "", "", ""], correct: 0 };
  const wrap = document.createElement("div");
  wrap.className = "q-block";
  wrap.id = id;
  wrap.innerHTML = `
    <div class="q-head">
      <span>SAVOL</span>
      <button type="button" class="remove-link" onclick="document.getElementById('${id}').remove()">O'chirish</button>
    </div>
    <input type="text" class="q-text" placeholder="Savol matni" value="${escapeAttr(q.q)}" />
    ${[0,1,2,3].map(i => `
      <div class="opt-row">
        <input type="radio" name="${id}-correct" value="${i}" ${q.correct === i ? "checked" : ""} />
        <input type="text" class="q-opt" placeholder="${String.fromCharCode(65+i)} variant" value="${escapeAttr(q.opts[i] || '')}" />
      </div>
    `).join("")}
  `;
  document.getElementById("qBuilder").appendChild(wrap);
}

function escapeAttr(s) {
  return (s || "").replace(/"/g, "&quot;");
}

function saveTopic() {
  const title = document.getElementById("f-title").value.trim();
  const region = document.getElementById("f-region").value;
  const guide = document.getElementById("f-guide").value.trim();

  if (!title) { alert("Mavzu nomini kiriting."); return; }

  const blocks = Array.from(document.querySelectorAll("#qBuilder .q-block"));
  const questions = [];
  for (const b of blocks) {
    const qText = b.querySelector(".q-text").value.trim();
    const optInputs = Array.from(b.querySelectorAll(".q-opt"));
    const opts = optInputs.map(i => i.value.trim());
    const correctRadio = b.querySelector("input[type=radio]:checked");
    if (!qText || opts.some(o => !o) || !correctRadio) continue;
    questions.push({ q: qText, opts: opts, correct: parseInt(correctRadio.value) });
  }

  if (editingId) {
    const t = topics.find(x => x.id === editingId);
    t.title = title; t.region = region; t.guide = guide; t.questions = questions;
  } else {
    topics.push({ id: "t" + Date.now(), title, region, guide, questions });
  }
  saveTopics();
  goHome();
}

function toggleTopicSelect(id, checked) {
  if (checked) {
    if (selectedTopicIds.length >= 5) {
      alert("Ko'pi bilan 5 ta mavzu tanlash mumkin");
      renderSelectList();
      return;
    }
    selectedTopicIds.push(id);
  } else {
    selectedTopicIds = selectedTopicIds.filter(x => x !== id);
  }
  const btn = document.getElementById("startSelectedBtn");
  btn.disabled = selectedTopicIds.length === 0;
}

      [all[i], all[j]] = [all[j], all[i]];
    }
    quizQueue = all.map(q => shuffleOptions(q));
  document.getElementById("quizHeading").textContent = "Test";
  runQuiz();
 }
// ---------- TOPIC VIEW ----------
function openTopic(id) {
  currentTopicId = id;
  const t = topics.find(x => x.id === id);
  document.getElementById("topicViewTitle").textContent = t.title;
  document.getElementById("topicViewTag").innerHTML =
    `<span class="region-tag ${t.region}">${t.region === 'markaziy' ? "Markaziy Osiyo" : "Jahon tarixi"}</span>`;
  document.getElementById("topicViewGuide").textContent = t.guide || "(Qo'llanma matni kiritilmagan)";
  const btn = document.getElementById("topicStartTestBtn");
  if (t.questions.length === 0) {
    btn.textContent = "Bu mavzuda test yo'q";
    btn.disabled = true;
  } else {
    btn.textContent = `Testni boshlash (${t.questions.length} ta savol)`;
    btn.disabled = false;
  }
  showScreen("screen-topic");
}

function deleteTopic() {
  if (!confirm("Ushbu mavzuni butunlay o'chirmoqchimisiz?")) return;
  topics = topics.filter(x => x.id !== currentTopicId);
  saveTopics();
  goHome();
}

function shuffleOptions(q) {
  const idx = [0, 1, 2, 3];
  for (let i = idx.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [idx[i], idx[j]] = [idx[j], idx[i]];
  }
  const newOpts = idx.map(i => q.opts[i]);
  const newCorrect = idx.indexOf(q.correct);
  return { q: q.q, opts: newOpts, correct: newCorrect };
}

// ---------- QUIZ ----------
function startTopicTest() {
  const t = topics.find(x => x.id === currentTopicId);
  if (!t || t.questions.length === 0) return;
  quizIsBig = false;
  quizQueue = t.questions.map(q => shuffleOptions(q));
  document.getElementById("quizHeading").textContent = t.title;
  runQuiz();
}

function startBigTest() {
  const all = [];
  topics.forEach(t => t.questions.forEach(q => all.push({...q})));
  if (all.length === 0) return;
  quizIsBig = true;
  quizQueue = all.map(q => shuffleOptions(q));
  document.getElementById("quizHeading").textContent = "Katta test";
  runQuiz();
}

function runQuiz() {
  quizIndex = 0;
  quizScore = 0;
  quizWrong = [];
  showScreen("screen-quiz");
  renderQuizQuestion();
}

function renderQuizQuestion() {
  const q = quizQueue[quizIndex];
  document.getElementById("quizProgress").textContent = `Savol ${quizIndex + 1} / ${quizQueue.length}`;
  document.getElementById("quizQ").textContent = q.q;
  const optsDiv = document.getElementById("quizOpts");
  optsDiv.innerHTML = q.opts.map((o, i) => `
    <button class="opt-btn" data-i="${i}" onclick="answerQuiz(${i})">${escapeHtml(o)}</button>
  `).join("");
  document.getElementById("nextBtn").style.display = "none";
}

function answerQuiz(selected) {
  const q = quizQueue[quizIndex];
  const buttons = document.querySelectorAll("#quizOpts .opt-btn");
  buttons.forEach(b => b.classList.add("disabled"));
  buttons[q.correct].classList.add("correct");
  if (selected === q.correct) {
    quizScore++;
  } else {
    buttons[selected].classList.add("wrong");
    quizWrong.push({ q: q.q, your: q.opts[selected], right: q.opts[q.correct] });
  }
  const nextBtn = document.getElementById("nextBtn");
  nextBtn.textContent = (quizIndex + 1 < quizQueue.length) ? "Keyingisi" : "Natijani ko'rish";
  nextBtn.style.display = "block";
}

function goNext() {
  quizIndex++;
  if (quizIndex < quizQueue.length) {
    renderQuizQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  document.getElementById("resultScore").textContent = `${quizScore} / ${quizQueue.length}`;
  const rev = document.getElementById("resultReview");
  if (quizWrong.length === 0) {
    rev.innerHTML = `<div class="empty-box">Barcha savollarga to'g'ri javob berdingiz! 🎉</div>`;
  } else {
    rev.innerHTML = `<p class="field-label" style="margin-top:0;">Xato javoblar</p>` + quizWrong.map(w => `
      <div class="review-item">
        <div class="q">${escapeHtml(w.q)}</div>
        <div class="your">Sizning javobingiz: ${escapeHtml(w.your)}</div>
        <div class="right">To'g'ri javob: ${escapeHtml(w.right)}</div>
      </div>
    `).join("");
  }
  showScreen("screen-result");
}

// init
loadTopics();
renderHome();
</script>
