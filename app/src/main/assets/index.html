<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Tarix Qo'llanma va Testlar</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: #F0E6CF;
    color: #2B2118;
    font-family: -apple-system, Roboto, "Segoe UI", Arial, sans-serif;
  }
  .serif { font-family: Georgia, "Times New Roman", serif; }
  .screen { display: none; }
  .screen.active { display: block; }

  header {
    padding: 24px 20px 18px;
    text-align: center;
    border-bottom: 3px double #C9A227;
  }
  header .eyebrow {
    letter-spacing: 0.25em;
    font-size: 11px;
    color: #A4462B;
    font-weight: 600;
    margin: 0 0 4px;
  }
  header h1 {
    font-size: 1.5rem;
    font-weight: 700;
    color: #1B2A4A;
    line-height: 1.15;
    margin: 0;
  }

  .topbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 16px 8px;
    max-width: 720px;
    margin: 0 auto;
  }
  .back-btn {
    background: none;
    border: none;
    font-size: 20px;
    color: #1B2A4A;
    padding: 4px 8px;
  }
  .topbar h2 {
    font-size: 1.1rem;
    color: #1B2A4A;
    margin: 0;
  }

  main { padding: 12px 16px 60px; max-width: 720px; margin: 0 auto; }

  .btn {
    display: inline-block;
    padding: 12px 18px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    border: none;
    text-align: center;
  }
  .btn-primary { background: #1B2A4A; color: #F0E6CF; }
  .btn-gold { background: #C9A227; color: #1B2A4A; }
  .btn-outline { background: transparent; color: #1B2A4A; border: 1.5px solid #1B2A4A; }
  .btn-danger { background: transparent; color: #A4462B; border: 1.5px solid #A4462B; }
  .btn-block { display: block; width: 100%; margin-top: 10px; }
  .btn:active { transform: scale(0.98); }

  .big-test-card {
    background: linear-gradient(135deg, #1B2A4A, #2F5D62);
    color: #F0E6CF;
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 16px;
    border: 2px solid #C9A227;
  }
  .big-test-card h3 { margin: 0 0 4px; font-size: 1.2rem; }
  .big-test-card p { margin: 0 0 12px; font-size: 13px; opacity: 0.85; }

  .topic-card {
    background: #FAF5E8;
    border: 1px solid #DDD0AE;
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .topic-card .info { min-width: 0; }
  .topic-card .title { font-weight: 600; font-size: 14.5px; color: #1B2A4A; }
  .topic-card .tag { font-size: 11px; color: #A4462B; margin-top: 3px; }
  .topic-card .count { font-size: 11px; color: #5A5140; margin-top: 2px; }
  .chev { color: #C9A227; font-size: 20px; }

  .empty-box {
    text-align: center;
    padding: 40px 20px;
    color: #5A5140;
    font-size: 13.5px;
  }

  .guide-text {
    background: #FAF5E8;
    border: 1px solid #DDD0AE;
    border-radius: 14px;
    padding: 16px;
    font-size: 14.5px;
    line-height: 1.7;
    white-space: pre-wrap;
    margin-bottom: 16px;
  }

  label.field-label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: #5A5140;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 14px 0 6px;
  }
  input[type=text], textarea, select {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1.5px solid #C9A227;
    background: #FAF5E8;
    color: #2B2118;
    font-size: 14px;
    font-family: inherit;
    outline: none;
  }
  textarea { min-height: 110px; resize: vertical; }

  .q-block {
    background: #FAF5E8;
    border: 1px solid #DDD0AE;
    border-radius: 12px;
    padding: 12px;
    margin-top: 12px;
  }
  .q-block .q-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .q-head span { font-size: 12px; font-weight: 700; color: #A4462B; }
  .opt-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .opt-row input[type=text] { flex: 1; }
  .opt-row input[type=radio] { width: 18px; height: 18px; accent-color: #1B2A4A; }

  .remove-link {
    background: none; border: none; color: #A4462B; font-size: 12px; font-weight: 600;
  }

  .quiz-progress { font-size: 12px; color: #5A5140; margin-bottom: 10px; }
  .quiz-q { font-size: 16px; font-weight: 600; color: #1B2A4A; margin-bottom: 16px; line-height: 1.4; }
  .opt-btn {
    display: block;
    width: 100%;
    text-align: left;
    padding: 13px 14px;
    border-radius: 12px;
    border: 1.5px solid #C9A227;
    background: #FAF5E8;
    color: #2B2118;
    font-size: 14px;
    margin-bottom: 10px;
  }
  .opt-btn.correct { background: #2F5D62; border-color: #2F5D62; color: #F0E6CF; }
  .opt-btn.wrong { background: #A4462B; border-color: #A4462B; color: #F0E6CF; }
  .opt-btn.disabled { pointer-events: none; }

  .score-box {
    text-align: center;
    padding: 24px 16px;
    background: #FAF5E8;
    border: 2px solid #C9A227;
    border-radius: 16px;
    margin-bottom: 16px;
  }
  .score-box .num { font-size: 2.4rem; font-weight: 700; color: #1B2A4A; font-family: Georgia, serif; }
  .score-box .lbl { font-size: 13px; color: #5A5140; margin-top: 4px; }

  .review-item {
    background: #FAF5E8;
    border: 1px solid #DDD0AE;
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 10px;
  }
  .review-item .q { font-size: 13.5px; font-weight: 600; color: #1B2A4A; margin-bottom: 6px; }
  .review-item .your { font-size: 12.5px; color: #A4462B; }
  .review-item .right { font-size: 12.5px; color: #2F5D62; margin-top: 2px; }

  .region-tag {
    font-size: 10.5px;
    padding: 2px 8px;
    border-radius: 999px;
    border: 1px solid;
    display: inline-block;
  }
  .region-tag.markaziy { color: #2F5D62; border-color: #2F5D62; }
  .region-tag.jahon { color: #A4462B; border-color: #A4462B; }
</style>
</head>
<body>

<header>
  <p class="eyebrow">O'QITUVCHI UCHUN QO'LLANMA</p>
  <h1 class="serif">Tarix Qo'llanma va Testlar</h1>
</header>

<!-- HOME -->
<div class="screen active" id="screen-home">
  <main>
    <div class="big-test-card" id="bigTestCard">
      <h3 class="serif">Katta test</h3>
      <p id="bigTestDesc">Barcha mavzulardan yig'ilgan savollar</p>
      <button class="btn btn-gold btn-block" onclick="startBigTest()">Katta testni boshlash</button>
    </div>

    <button class="btn btn-primary btn-block" onclick="openForm()">+ Yangi mavzu qo'shish</button>

    <div id="topicList" style="margin-top:16px;"></div>
  </main>
</div>

<!-- TOPIC FORM -->
<div class="screen" id="screen-form">
  <div class="topbar">
    <button class="back-btn" onclick="goHome()">←</button>
    <h2 id="formHeading">Yangi mavzu</h2>
  </div>
  <main>
    <label class="field-label">Mavzu nomi</label>
    <input type="text" id="f-title" placeholder="Masalan: Amir Temur va Temuriylar davri" />

    <label class="field-label">Yo'nalish</label>
    <select id="f-region">
      <option value="markaziy">Markaziy Osiyo / O'zbekiston</option>
      <option value="jahon">Jahon tarixi</option>
    </select>

    <label class="field-label">Qo'llanma matni</label>
    <textarea id="f-guide" placeholder="Mavzu bo'yicha tushuntirish matnini shu yerga yozing..."></textarea>

    <label class="field-label">Test savollari</label>
    <div id="qBuilder"></div>
    <button class="btn btn-outline btn-block" onclick="addQuestionBlock()">+ Savol qo'shish</button>

    <div style="display:flex; gap:10px; margin-top:20px;">
      <button class="btn btn-outline" style="flex:1;" onclick="goHome()">Bekor qilish</button>
      <button class="btn btn-primary" style="flex:1;" onclick="saveTopic()">Saqlash</button>
     </div>
  </main>
</div>

<!-- TOPIC VIEW -->
<div class="screen" id="screen-topic">
  <div class="topbar">
    <button class="back-btn" onclick="goHome()">←</button>
    <h2 id="topicViewTitle"></h2>
  </div>
  <main>
    <div id="topicViewTag" style="margin-bottom:10px;"></div>
    <div class="guide-text" id="topicViewGuide"></div>
    <button class="btn btn-gold btn-block" id="topicStartTestBtn" onclick="startTopicTest()">Testni boshlash</button>
    <div style="display:flex; gap:10px; margin-top:10px;">
      <button class="btn btn-outline" style="flex:1;" onclick="editTopic()">Tahrirlash</button>
      <button class="btn btn-danger" style="flex:1;" onclick="deleteTopic()">O'chirish</button>
    </div>
  </main>
</div>

<!-- QUIZ -->
<div class="screen" id="screen-quiz">
  <div class="topbar">
    <button class="back-btn" onclick="goHome()">←</button>
    <h2 id="quizHeading">Test</h2>
  </div>
  <main>
    <div class="quiz-progress" id="quizProgress"></div>
    <div class="quiz-q" id="quizQ"></div>
    <div id="quizOpts"></div>
    <button class="btn btn-gold btn-block" id="nextBtn" style="display:none;" onclick="goNext()">Keyingisi</button>
  </main>
</div>

<!-- RESULT -->
<div class="screen" id="screen-result">
  <div class="topbar">
    <h2>Natija</h2>
  </div>
  <main>
    <div class="score-box">
      <div class="num" id="resultScore"></div>
      <div class="lbl">to'g'ri javob</div>
    </div>
    <div id="resultReview"></div>
    <button class="btn btn-primary btn-block" onclick="goHome()">Bosh sahifaga qaytish</button>
  </main>
</div>

<script>
const STORAGE_KEY = "tarix_qollanma_topics_v1";

const BUILTIN_TOPICS = [
  {
    id: "builtin_1",
    title: "Qadimgi tarix ildizlari (6-sinf, 1-mavzu)",
    region: "jahon",
    guide: `1. Kirish: Vatan tuyg'usi va tabiat manzaralari
Matn Vatan tushunchasini tabiat manzaralari orqali ochib beradi: viqorli tog'lar, muzlar erimaydigan qoyalar, toshqin daryolar hosil qiluvchi tog' jilg'alari, poyonsiz cho'llar va ularni kesib o'tgan karvon yo'llari. Ushbu yo'llar kesishgan joylarda dunyoning turli mamlakatlaridan kelgan odamlar to'planib, savdo-sotiq qilishgan — bu O'rta Osiyoning qadimdan xalqaro savdo va madaniy aloqalar markazi bo'lganidan dalolat beradi. Bugungi kunda ham vodiylar, cho'l va tog'larda qadimgi shaharlar, qal'alar va ibodatxonalarning xarobalari saqlanib qolgan. Bu joylarni odamlar allaqachon tark etgan bo'lsa-da, qadimshunoslar (arxeologlar) ularni qayta "tiriltirib", o'tmish sirlarini ochib bermoqda.

2. Qadimgi tarixni kim o'rganadi?
Insoniyatning qadimgi tarixini turli sohalar olimlari o'rganadi: arxeolog — qadimgi manzilgohlarda qazishma ishlarini olib boruvchi olim; antropolog — qadimgi odamlarning suyak qoldiqlarini o'rganuvchi olim; etnograf — hozirgi xalqlarning urf-odat va an'analarini o'rganuvchi olim.

3. Qadimgi tarix bo'yicha manbalar
3.1. Moddiy (ashyoviy) manbalar — arxeologik qazishmalar davomida topilgan barcha narsalar: mehnat qurollari, sopol idishlar, qurol-yarog'lar, zeb-ziynat buyumlari. Qadimda inson qo'li bilan yaratilgan barcha narsalar ashyoviy manbalar jumlasiga kiradi.
3.2. Yozma manbalar — arxeologiya ma'lumotlari qadimgi dunyo tarixi haqida to'liq tasavvur berolmaydi, shu sababli olimlar yozma manbalarga ham murojaat qiladilar: "Avesto" kitobi, Behistun qoyasi yozuvlari (Eronda joylashgan), Gerodot, Strabon va Arrian kabi tarixchilarning asarlari.

4. Eng qadimgi tuzumni davrlashtirish
Jahondagi barcha xalqlarning tarixi ibtidoiy jamoa tuzumidan boshlangan. Insoniyat rivojidagi birinchi bosqich — kishilarning alohida guruhlarga birlashuvi bo'lib, bu eng qadimgi odamlarning dastlabki jamoasi edi.
4.1. Ijtimoiy tuzum bosqichlari — ibtidoiy jamoalar asta-sekin qarindosh urug'lardan iborat alohida urug' jamoalariga bo'lingan. Dastlab matriarxat (ona urug'i davri, ayol boshchiligidagi jamoa tuzumi) hukm surgan. Keyinchalik mehnat qurollari va xo'jalik yuritish shakllari takomillashgani sababli yetakchilik erkak kishiga o'tib, patriarxat (ota urug'i davri, erkak boshchiligidagi jamoa tuzumi) boshlangan.
4.2. Tosh davri bosqichlari — eng qadimgi odamlar dastlabki mehnat qurollarini toshdan yasagani uchun arxeologlar insoniyat tarixining boshlanishini "tosh davri" deb ataydilar. Bu davr to'rtta bosqichga bo'linadi: paleolit — qadimgi tosh davri (yunoncha "qadimgi"+"tosh"), mezolit — o'rta tosh davri (yunoncha "o'rta"+"tosh"), neolit — yangi tosh davri (yunoncha "yangi"+"tosh"), eneolit — mis-tosh davri (lotincha "mis"+yunoncha "tosh"). Paleolit o'zi yana ilk, o'rta va so'nggi davrlarga bo'linadi.

5. Asosiy tushunchalar lug'ati
Arxeolog — qadimgi manzilgohlarda qazishma ishlarini olib boruvchi olim
Antropolog — qadimgi odamlarning suyak qoldiqlarini o'rganuvchi olim
Etnograf — hozirgi xalqlarning urf-odat va an'analarini o'rganuvchi olim
Matriarxat — ona urug'i davri, ayol boshchiligidagi jamoa tuzumi
Patriarxat — ota urug'i davri, erkak boshchiligidagi jamoa tuzumi
Paleolit, Mezolit, Neolit, Eneolit — tosh davrining bosqichlari`,
    questions: [
      { q: "Qadimgi dunyo tarixi qaysi davrni o'z ichiga oladi?", opts: ["Iso payg'ambar tug'ilganidan to milodiy 476-yilda G'arbiy Rim imperiyasi qulaguniga qadar kechgan voqealar","Eng qadimgi shaharlar, yozuv, davlatlar tashkil topganidan to milodiy 476-yilda G'arbiy Rim imperiyasi qulaguniga qadar kechgan voqealar","Insonlarning ibtidoiy alohida guruhlarga birlashuvidan to 395-yilda Rim imperiyasining ikkiga bo'linguniga qadar kechgan voqealar","Yer yuzida odam paydo bo'lganidan to milodiy 476-yilda G'arbiy Rim imperiyasi qulaguniga qadar"], correct: 3 },
      { q: "Yer yuzida odam paydo bo'lganidan to milodiy 476-yilda G'arbiy Rim imperiyasi qulaguniga qadar kechgan voqealar tarix fanida qanday ataladi?", opts: ["Antik davr","Ibtidoiy davr","Qadimgi dunyo tarixi","Ilk o'rta asrlar tarixi"], correct: 2 },
      { q: "Qaysi olimlar qadim zamonlarda odamlar yashagan manzilgohlarda qazishma ishlarini amalga oshiradilar?", opts: ["Lingvistlar","Etnograflar","Antropologlar","Arxeologlar"], correct: 3 },
      { q: "Qaysi olimlar qadimgi odamlarning qoldiqlari (skelet va bosh chanoq)ni sinchiklab tekshirib, ularning tashqi ko'rinishini tiklaydilar?", opts: ["Lingvistlar","Etnograflar","Antropologlar","Arxeologlar"], correct: 2 },
      { q: "Qaysi olimlar qadimgi odamlarning ko'pgina udumlari, xo'jalik va madaniy an'analarini saqlab qolgan hozirda mavjud qabilalar va xalqlarni o'rganadilar?", opts: ["Lingvistlar","Etnograflar","Antropologlar","Arxeologlar"], correct: 1 },
      { q: "Moddiy manbalarga nimalar kiradi?", opts: ["Mehnat qurollari, sopol idishlar, qurol-aslahalar, zeb-ziynat buyumlari","Behistun yozuvlari, Gerodot, Strabon, Sim Syan asarlari","Taqinchoqlar, \"Avesto\" kitobi","Turli yilnomalar, qonunlar majmuyi, biografiyalar"], correct: 0 },
      { q: "Yozma manbalarga nimalar kiradi?", opts: ["Mehnat qurollari, sopol idishlar, qurol-aslahalar, zeb-ziynat buyumlari","Behistun yozuvlari, Gerodot, Strabon, Sim Syan asarlari","Taqinchoqlar, \"Avesto\" kitobi","Turli yilnomalar, turli taqinchoqlar, zargarlik buyumlari"], correct: 1 },
      { q: "Moddiy manbalarga nimalar kiradi? (2)", opts: ["Tarixchilar tomonidan yozib qoldirilgan hamma asarlar","Behistun yozuvlari, Gerodot, Strabon, Sim Syan asarlari","Qadimda inson qo'li bilan yaratilgan barcha narsalar","Turli yilnomalar, qonunlar majmuyi, biografiyalar"], correct: 2 },
      { q: "O'rta Osiyo bo'yicha eng qadimgi yozma manbani aniqlang.", opts: ["Behistun yozuvlari","\"Avesto\" kitobi","Gerodotning \"Tarix\" asari","Sim Syanning \"Tarixiy yilnomalar\" asari"], correct: 1 },
      { q: "Behistun qoyasi yozuvlari qayerda joylashgan?", opts: ["Iroqda","Afg'onistonda","Turkiyada","Eronda"], correct: 3 },

      { q: "Eng qadimgi odamlarning dastlabki jamoasi, bu — … .", opts: ["Qabilalar ittifoqi","Alohida guruhlar","Qarindoshlardan tarkib topgan urug'","Qabila"], correct: 1 },
      { q: "Ibtidoiy jamoalar asta-sekin … bo'lina boshladi.", opts: ["Urug' jamoalariga","Qabilaga","Qabilalar ittifoqiga","Davlatga"], correct: 0 },
      { q: "Qarindoshlardan tarkib topgan jamoa nima deb ataladi?", opts: ["Ibtidoiy to'da","Urug'","Qabila","Qabilalar ittifoqi"], correct: 1 },
      { q: "Quyidagilardan qaysi biri \"Tarix\" nomli asar yozgan?", opts: ["Gerodot","Strabon","Arrian","Kvint Kursiy Ruf"], correct: 0 },
      { q: "\"Aleksandrning harbiy yurishlari\" asari muallifini aniqlang.", opts: ["Gerodot","Strabon","Arrian","Kvint Kursiy Ruf"], correct: 2 },
      { q: "Quyidagilardan qaysi biri \"Geografiya\" nomli asar yozgan?", opts: ["Gerodot","Strabon","Arrian","Kvint Kursiy Ruf"], correct: 1 },
      { q: "Nechanchi asrda Gerodot \"Tarix\" nomli kitobini yozgan?", opts: ["Mil. avv. V asrda","Milodiy II asrda","Mil. avv. I asrda","Mil. avv. II asrda"], correct: 0 },

      { q: "Arrian nechanchi asrda \"Aleksandrning harbiy yurishlari\" asarini yozgan?", opts: ["Mil. avv. I asr oxirlarida","Mil. avv. II asrda","Milodiy I asr oxirlarida","Milodiy II asrda"], correct: 3 },

      { q: "Nima uchun insoniyat tarixining boshlanishi \"tosh davri\" deb ataladi?", opts: ["Dastlabki zeb-ziynat buyumlari toshdan yasalganligi tufayli","Dastlabki ov qurollari toshdan yasalganligi tufayli","Dastlabki mehnat qurollari toshdan yasalganligi tufayli","Dastlabki uylar toshdan qurilgani tufayli"], correct: 2 },

Tabiat hodisalarini tushuntira olmagan qadimgi odamlar momaqaldiroq, yashin, shamol, yomg'ir kabi hodisalarga sig'ina boshlashgan. Ular tabiatni jonli deb hisoblab, uni inson xususiyatlari bilan bog'lab talqin qilishgan.

function loadTopics() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    topics = raw ? JSON.parse(raw) : [];
  } catch (e) {
    topics = [];
  }
  let changed = false;
  BUILTIN_TOPICS.forEach(bt => {
    if (!topics.find(t => t.id === bt.id)) {
      topics.push(JSON.parse(JSON.stringify(bt)));
      changed = true;
    }
  });
  if (changed) saveTopics();
}
function saveTopics() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(topics));
}

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function goHome() {
  renderHome();
  showScreen("screen-home");
}

  document.getElementById("bigTestCard").style.opacity = totalQ > 0 ? "1" : "0.5";
  document.querySelector("#bigTestCard button").disabled = totalQ === 0;

  const list = document.getElementById("topicList");
  if (topics.length === 0) {
    list.innerHTML = `<div class="empty-box">Hali mavzu qo'shilmagan.<br>Yuqoridagi tugma orqali birinchi mavzuni yarating.</div>`;
    return;
  }
  list.innerHTML = topics.map(t => `
    <div class="topic-card" onclick="openTopic('${t.id}')">
      <div class="info">
        <div class="title">${escapeHtml(t.title)}</div>
        <div class="tag"><span class="region-tag ${t.region}">${t.region === 'markaziy' ? "Markaziy Osiyo" : "Jahon tarixi"}</span></div>
        <div class="count">${t.questions.length} ta test savoli</div>     
</div>
      <div class="chev">›</div>
    </div>
  `).join("");
}

function escapeHtml(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

// ---------- FORM ----------
function openForm() {
  editingId = null;
  document.getElementById("formHeading").textContent = "Yangi mavzu";
  document.getElementById("f-title").value = "";
  document.getElementById("f-region").value = "markaziy";
  document.getElementById("f-guide").value = "";
  document.getElementById("qBuilder").innerHTML = "";
  addQuestionBlock();
  showScreen("screen-form");
}

function editTopic() {
  const t = topics.find(x => x.id === currentTopicId);
  if (!t) return;
  editingId = t.id;
  document.getElementById("formHeading").textContent = "Mavzuni tahrirlash";
  document.getElementById("f-title").value = t.title;
  document.getElementById("f-region").value = t.region;
  document.getElementById("f-guide").value = t.guide;
  document.getElementById("qBuilder").innerHTML = "";
  t.questions.forEach(q => addQuestionBlock(q));
  if (t.questions.length === 0) addQuestionBlock();
  showScreen("screen-form");
}

let qBlockCounter = 0;
function addQuestionBlock(existing) {
  qBlockCounter++;
  const id = "qb" + qBlockCounter;
  const q = existing || { q: "", opts: ["", "", "", ""], correct: 0 };
  const wrap = document.createElement("div");
  wrap.className = "q-block";
  wrap.id = id;
  wrap.innerHTML = `
    <div class="q-head">
      <span>SAVOL</span>
      <button type="button" class="remove-link" onclick="document.getElementById('${id}').remove()">O'chirish</button>
    </div>
    <input type="text" class="q-text" placeholder="Savol matni" value="${escapeAttr(q.q)}" />
    ${[0,1,2,3].map(i => `
      <div class="opt-row">
        <input type="radio" name="${id}-correct" value="${i}" ${q.correct === i ? "checked" : ""} />
        <input type="text" class="q-opt" placeholder="${String.fromCharCode(65+i)} variant" value="${escapeAttr(q.opts[i] || '')}" />
      </div>
    `).join("")}
  `;
  document.getElementById("qBuilder").appendChild(wrap);
}

function escapeAttr(s) {
  return (s || "").replace(/"/g, "&quot;");
}

function saveTopic() {
  const title = document.getElementById("f-title").value.trim();
  const region = document.getElementById("f-region").value;
  const guide = document.getElementById("f-guide").value.trim();

  if (!title) { alert("Mavzu nomini kiriting."); return; }

  const blocks = Array.from(document.querySelectorAll("#qBuilder .q-block"));
  const questions = [];
  for (const b of blocks) {
    const qText = b.querySelector(".q-text").value.trim();
    const optInputs = Array.from(b.querySelectorAll(".q-opt"));
    const opts = optInputs.map(i => i.value.trim());
    const correctRadio = b.querySelector("input[type=radio]:checked");
    if (!qText || opts.some(o => !o) || !correctRadio) continue;
    questions.push({ q: qText, opts: opts, correct: parseInt(correctRadio.value) });
  }

  if (editingId) {
    const t = topics.find(x => x.id === editingId);
    t.title = title; t.region = region; t.guide = guide; t.questions = questions;
  } else {
    topics.push({ id: "t" + Date.now(), title, region, guide, questions });
  }
  saveTopics();
  goHome();
}

// ---------- TOPIC VIEW ----------
function openTopic(id) {
  currentTopicId = id;
  const t = topics.find(x => x.id === id);
  document.getElementById("topicViewTitle").textContent = t.title;
  document.getElementById("topicViewTag").innerHTML =
    `<span class="region-tag ${t.region}">${t.region === 'markaziy' ? "Markaziy Osiyo" : "Jahon tarixi"}</span>`;
  document.getElementById("topicViewGuide").textContent = t.guide || "(Qo'llanma matni kiritilmagan)";
  const btn = document.getElementById("topicStartTestBtn");
  if (t.questions.length === 0) {
    btn.textContent = "Bu mavzuda test yo'q";
    btn.disabled = true;
  } else {
    btn.textContent = `Testni boshlash (${t.questions.length} ta savol)`;
    btn.disabled = false;
  }
  showScreen("screen-topic");
}

function deleteTopic() {
  if (!confirm("Ushbu mavzuni butunlay o'chirmoqchimisiz?")) return;
  topics = topics.filter(x => x.id !== currentTopicId);
  saveTopics();
  goHome();
}

function shuffleOptions(q) {
  const idx = [0, 1, 2, 3];
  for (let i = idx.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [idx[i], idx[j]] = [idx[j], idx[i]];
  }
  const newOpts = idx.map(i => q.opts[i]);
  const newCorrect = idx.indexOf(q.correct);
  return { q: q.q, opts: newOpts, correct: newCorrect };
}

// ---------- QUIZ ----------
function startTopicTest() {
  const t = topics.find(x => x.id === currentTopicId);
  if (!t || t.questions.length === 0) return;
  quizIsBig = false;
  quizQueue = t.questions.map(q => shuffleOptions(q));
  document.getElementById("quizHeading").textContent = t.title;
  runQuiz();
}

function startBigTest() {
  const all = [];
  topics.forEach(t => t.questions.forEach(q => all.push({...q})));
  if (all.length === 0) return;
  quizIsBig = true;
  quizQueue = all.map(q => shuffleOptions(q));
  document.getElementById("quizHeading").textContent = "Katta test";
  runQuiz();
}

function runQuiz() {
  quizIndex = 0;
  quizScore = 0;
  quizWrong = [];
  showScreen("screen-quiz");
  renderQuizQuestion();
}

function renderQuizQuestion() {
  const q = quizQueue[quizIndex];
  document.getElementById("quizProgress").textContent = `Savol ${quizIndex + 1} / ${quizQueue.length}`;
  document.getElementById("quizQ").textContent = q.q;
  const optsDiv = document.getElementById("quizOpts");
  optsDiv.innerHTML = q.opts.map((o, i) => `
    <button class="opt-btn" data-i="${i}" onclick="answerQuiz(${i})">${escapeHtml(o)}</button>
  `).join("");
  document.getElementById("nextBtn").style.display = "none";
}

function answerQuiz(selected) {
  const q = quizQueue[quizIndex];
  const buttons = document.querySelectorAll("#quizOpts .opt-btn");
  buttons.forEach(b => b.classList.add("disabled"));
  buttons[q.correct].classList.add("correct");
  if (selected === q.correct) {
    quizScore++;
  } else {
    buttons[selected].classList.add("wrong");
    quizWrong.push({ q: q.q, your: q.opts[selected], right: q.opts[q.correct] });
  }
  const nextBtn = document.getElementById("nextBtn");
  nextBtn.textContent = (quizIndex + 1 < quizQueue.length) ? "Keyingisi" : "Natijani ko'rish";
  nextBtn.style.display = "block";
}

function goNext() {
  quizIndex++;
  if (quizIndex < quizQueue.length) {
    renderQuizQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  document.getElementById("resultScore").textContent = `${quizScore} / ${quizQueue.length}`;
  const rev = document.getElementById("resultReview");
  if (quizWrong.length === 0) {
    rev.innerHTML = `<div class="empty-box">Barcha savollarga to'g'ri javob berdingiz! 🎉</div>`;
  } else {
    rev.innerHTML = `<p class="field-label" style="margin-top:0;">Xato javoblar</p>` + quizWrong.map(w => `
      <div class="review-item">
        <div class="q">${escapeHtml(w.q)}</div>
        <div class="your">Sizning javobingiz: ${escapeHtml(w.your)}</div>
        <div class="right">To'g'ri javob: ${escapeHtml(w.right)}</div>
      </div>
    `).join("");
  }
  showScreen("screen-result");
}

// init
loadTopics();
renderHome();
</script>
</body>
</html>
